name: Publish Lagoon 1.0.4 archive
on:
  push:
    branches: ['codex/lagoon-1.0.4']
    paths: ['.github/workflows/publish-lagoon-104.yml']
permissions:
  contents: write
concurrency:
  group: lagoon-release-1.0.4
jobs:
  release:
    if: github.repository == 'Strykus/TF1-maps'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and verify the published map archive
        shell: bash
        run: |
          archive=Avalar-TF1_Lagoon-1.0.4.zip
          curl --fail --location --silent --show-error --retry 3 --max-time 480 \
            --output "$archive" "https://gcdn.thunderstore.io/live/repository/packages/$archive"
          test "$(stat --format=%s "$archive")" = 1060352838
          printf '%s  %s\n' '7315dde627e715caa90d0b9a55c9c6150dd156c8d82e76ecda4c63c363e8da2e' "$archive" | sha256sum --check --strict
      - name: Publish the verified ZIP as a GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Strykus/TF1-maps
        run: |
          archive=Avalar-TF1_Lagoon-1.0.4.zip
          checksum=7315dde627e715caa90d0b9a55c9c6150dd156c8d82e76ecda4c63c363e8da2e
          gh release create 1.0.4 "$archive" --draft --latest=false \
            --target 'fd02f8ec274dc7d9a89b2ec786a65b15806fe175' --title 'TF1 Lagoon 1.0.4' \
            --notes "Titanfall 1 port of Lagoon for Titanfall 2 Northstar. This ZIP matches the published Thunderstore archive. SHA-256: $checksum"
          gh api --paginate 'repos/Strykus/TF1-maps/releases?per_page=100' \
            | jq -e --arg name "$archive" --arg digest "sha256:$checksum" \
                '.[] | select(.tag_name == "1.0.4" and .draft) | .assets[] | select(.name == $name and .state == "uploaded" and .size == 1060352838 and .digest == $digest)' > /dev/null
          gh release edit 1.0.4 --draft=false --latest=false
