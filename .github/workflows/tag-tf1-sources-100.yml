name: Tag the TF1 map sources 1.0.0
on:
  push:
    branches: ['codex/tf1-source-tag']
    paths: ['.github/workflows/tag-tf1-sources-100.yml']
permissions:
  contents: write
jobs:
  tag:
    if: github.repository == 'Strykus/TF1-maps'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create the exact version tag for Northstar VerifiedMods
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: a9fadd0809ad80826957d7e4ec67e9b784df985a
        shell: bash
        run: |
          gh api --method POST repos/Strykus/TF1-maps/git/refs \
            -f ref=refs/tags/1.0.0 -f sha="$SOURCE_COMMIT" \
            --jq '{ref,sha:.object.sha}'
